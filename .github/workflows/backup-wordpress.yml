# Scarica via FTP tutti i file del vecchio WordPress e li salva come archivio
# scaricabile dalla pagina del workflow (sezione "Artifacts"), per 90 giorni.
# Da lanciare UNA volta prima del primo deploy del nuovo sito.
# Il database va esportato a parte da phpMyAdmin (area clienti Aruba).
name: Backup vecchio WordPress

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Scarica i file dal server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          mkdir -p backup
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 60;
            mirror --parallel=4 --verbose=1 \"$FTP_SERVER_DIR\" backup;
            quit"
          echo "File scaricati: $(find backup -type f | wc -l)"
          du -sh backup

      - name: Comprimi
        run: tar -czf wordpress-files-$(date +%Y-%m-%d).tar.gz -C backup .

      - name: Salva come artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-files-backup
          path: wordpress-files-*.tar.gz
          retention-days: 90
          compression-level: 0
