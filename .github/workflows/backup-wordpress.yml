# Scarica via FTP tutti i file del vecchio WordPress e li salva come archivio
# CIFRATO scaricabile dalla pagina del workflow (sezione "Artifacts"), per 90 giorni.
#
# Il repository è pubblico: gli artifact sono scaricabili da chiunque abbia un account GitHub.
# Il backup contiene wp-config.php (password del database), quindi viene cifrato con
# 7-Zip AES-256, nomi dei file compresi. Senza il secret BACKUP_PASSWORD il workflow si ferma.
# Per aprirlo: 7-Zip (Windows), Keka o The Unarchiver (Mac), con la stessa password.
#
# Da lanciare UNA volta prima del primo deploy del nuovo sito.
# Il database va esportato a parte da phpMyAdmin (area clienti Aruba) e NON caricato qui.
name: Backup vecchio WordPress

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Controlla la password di cifratura
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ ${#BACKUP_PASSWORD} -lt 12 ]; then
            echo "::error::Manca il secret BACKUP_PASSWORD (almeno 12 caratteri). Backup non eseguito."
            exit 1
          fi

      - name: Installa lftp e 7-Zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp p7zip-full

      - name: Scarica i file dal server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          mkdir -p backup
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 60;
            mirror --parallel=4 \"$FTP_SERVER_DIR\" backup;
            quit"
          echo "File scaricati: $(find backup -type f | wc -l)"
          du -sh backup

      - name: Comprimi e cifra
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          7z a -t7z -mhe=on -p"$BACKUP_PASSWORD" "wordpress-files-$(date +%Y-%m-%d).7z" ./backup/* > /dev/null
          rm -rf backup
          ls -lh *.7z

      - name: Salva come artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-files-backup-cifrato
          path: wordpress-files-*.7z
          retention-days: 90
          compression-level: 0
