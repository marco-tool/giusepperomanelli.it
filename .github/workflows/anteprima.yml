# Anteprima del sito su GitHub Pages: https://marco-tool.github.io/giusepperomanelli.it/
# Si aggiorna da sola a ogni modifica su main. Non indicizzata dai motori di ricerca.
# Il sito vero resta su Aruba (workflow "Deploy su Aruba").
name: Anteprima su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anteprima
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # storia completa (senza i file vecchi) per la data di ultimo aggiornamento in /riferimenti/
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/anteprima.py /giusepperomanelli.it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
