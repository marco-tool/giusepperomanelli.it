# Pagine esterne che parlano di Giuseppe Romanelli (pagina /riferimenti/).
# Un elemento = una fonte. Campi:
#   gruppo       una delle sezioni della pagina (vedi src/pages/riferimenti.astro)
#   titolo       titolo della pagina, dell'opera o del testo
#   fonte        chi la pubblica (ente, rivista, autore)
#   anno         facoltativo: anno della pubblicazione o della scheda
#   descrizione  una o due frasi: cosa dice di Romanelli
#   url          facoltativo: se manca, il testo è solo a stampa
#   lingua       facoltativo: "in inglese", ecc.
#   altri        facoltativo: altri collegamenti della stessa fonte
#   sul_sito     facoltativo: pagina di questo sito collegata
# Collegamenti aperti e controllati il 28/11/2026.

